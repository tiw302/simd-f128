<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simd-f128 | High Precision</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div class="hero">
        <h1>simd-f128</h1>
        <p>128-bit double-double precision directly in your browser using webassembly.</p>
        <div class="demo-box">
            <div class="constants-bar">
                <button id="btnLoadPi" class="btn-small">Load Pi (π)</button>
                <button id="btnLoadE" class="btn-small">Load Euler (e)</button>
            </div>
            
            <input type="text" id="inputA" value="3.1415926535897932384626433832795">
            <select id="operator" class="op-select">
                <option value="add">+</option>
                <option value="sub">-</option>
                <option value="mul" selected>×</option>
                <option value="div">÷</option>
                <option value="pow">pow(A, B)</option>
                <option value="exp">exp(A)</option>
                <option value="log">log(A)</option>
                <option value="sin">sin(A)</option>
                <option value="cos">cos(A)</option>
                <option value="atan">atan(A)</option>
                <option value="atan2">atan2(A, B)</option>
                <option value="asin">asin(A)</option>
                <option value="acos">acos(A)</option>
                <option value="sqrt">sqrt(A)</option>
            </select>
            <input type="text" id="inputB" value="2.7182818284590452353602874713527">
            <br>
            <div id="validationWarning" class="warning-box" style="display: none;"></div>
            <button id="calcBtn">Calculate Result</button>
            
            <div class="result-container">
                <div class="result-header">
                    <div class="result-title">simd-f128 WASM (128-bit)</div>
                    <button id="btnCopy" class="btn-small">Copy</button>
                </div>
                <div class="result" id="resultSimdBox">Loading WASM Module...</div>
                
                <div class="result-title js-title">Standard JavaScript (64-bit)</div>
                <div class="result js-result" id="jsResultBox">...</div>
            </div>
        </div>

        <div class="demo-box" style="margin-top: 20px;">
            <div class="result-header">
                <div class="result-title">Performance Benchmark (1M Ops)</div>
                <button id="benchBtn" class="btn-small">Run Benchmark</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div>
                    <div style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">WASM (SIMD)</div>
                    <div class="result" id="wasmSimdTime" style="text-align: center; padding: 10px;">-</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">WASM (Scalar)</div>
                    <div class="result" id="wasmScalarTime" style="text-align: center; padding: 10px;">-</div>
                </div>
                <div>
                    <div style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">JS Math (64-bit)</div>
                    <div class="result" id="jsTime" style="text-align: center; padding: 10px;">-</div>
                </div>
            </div>
        </div>

        <div class="footer-links">
            <a href="https://github.com/tiw302/simd-f128">GitHub Repository</a> | 
            <a href="https://tiw302.github.io/simd-f128/">Documentation</a>
        </div>
    </div>

    <script src="simd_f128_wasm_simd.js"></script>
    <script src="simd_f128_wasm_scalar.js"></script>
    <script src="app.js"></script>
</body>

</html>
