name: Mobile

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install AArch64 toolchain and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Compile and run (Android ARM64 / NEON via QEMU)
        run: |
          aarch64-linux-gnu-gcc tests/c/test_arithmetic.c \
            -O3 -lm -static -o test_aarch64
          qemu-aarch64 ./test_aarch64

  android-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ARMv7 toolchain and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: Compile and run (Android ARMv7 Scalar + VFPv4 via QEMU)
        run: |
          arm-linux-gnueabihf-gcc tests/c/test_arithmetic.c \
            -O3 -lm -static \
            -mfpu=neon-vfpv4 -mfloat-abi=hard \
            -o test_armv7
          qemu-arm ./test_armv7
