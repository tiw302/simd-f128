name: wasm

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-wasm-simd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install latest && ./emsdk activate latest
      - name: Compile and run (WASM + SIMD128, Node.js)
        run: |
          source emsdk/emsdk_env.sh
          emcc tests/test_arithmetic.c -O3 -msimd128 \
            -o test_wasm_simd.js
          node test_wasm_simd.js
      - name: Generate Summary
        if: always()
        run: |
          echo "### WebAssembly (SIMD128)" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SIMD Backend | WASM-SIMD128 (Node.js) |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime Tests | ${{ job.status == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY

  test-wasm-scalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install latest && ./emsdk activate latest
      - name: Compile and run (WASM Scalar fallback, Node.js)
        run: |
          source emsdk/emsdk_env.sh
          emcc tests/test_arithmetic.c -O3 \
            -o test_wasm_scalar.js
          node test_wasm_scalar.js
      - name: Generate Summary
        if: always()
        run: |
          echo "### WebAssembly (Scalar)" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SIMD Backend | Scalar (Node.js) |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime Tests | ${{ job.status == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
