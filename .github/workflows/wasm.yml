name: WASM

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  simd128:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install latest && ./emsdk activate latest
      - name: Compile and run (WASM + SIMD128, Node.js)
        run: |
          source emsdk/emsdk_env.sh
          emcc tests/test_arithmetic.c -O3 -msimd128 -o test_wasm_simd.js
          node test_wasm_simd.js
      - name: Build JS Wrapper and test
        run: |
          source emsdk/emsdk_env.sh
          cd js
          chmod +x build_wasm.sh
          ./build_wasm.sh
          cd ..
          node tests/test_js.js

  scalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install latest && ./emsdk activate latest
      - name: Compile and run (WASM Scalar fallback, Node.js)
        run: |
          source emsdk/emsdk_env.sh
          emcc tests/test_arithmetic.c -O3 -o test_wasm_scalar.js
          node test_wasm_scalar.js
