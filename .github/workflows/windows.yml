name: Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure (Scalar)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure